name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only need to read the code.
permissions:
  contents: read

jobs:
  pytest:
    # Most students use Windows, so the tests run on Windows AND on Ubuntu.
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false          # a failure on one system must not hide the result on the other
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Install Chromium (Linux, with system libraries)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run the tests
        run: python -m pytest
